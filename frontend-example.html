<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Platform Admin - Frontend Example</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-connected {
            background: #4caf50;
        }

        .status-disconnected {
            background: #f44336;
        }

        .db-info {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .db-info h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .db-info p {
            margin: 8px 0;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table thead {
            background: #667eea;
            color: white;
        }

        table th, table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-active {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-inactive {
            background: #ffebee;
            color: #c62828;
        }

        .badge-pending {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-approved {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-rejected {
            background: #ffebee;
            color: #c62828;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin: 0 5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-warning:hover {
            background: #e68900;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .course-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 4px solid #667eea;
        }

        .course-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .course-card p {
            color: #666;
            margin: 8px 0;
        }

        .course-card .creator {
            font-style: italic;
            color: #999;
            font-size: 14px;
        }

        .course-card .actions {
            margin-top: 15px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .stat-card p {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Learning Platform Admin</h1>
            <p>Manage users and moderate courses</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('database')">Database Status</button>
            <button class="tab" onclick="switchTab('users')">Users</button>
            <button class="tab" onclick="switchTab('courses')">All Courses</button>
            <button class="tab" onclick="switchTab('pending')">Pending Courses</button>
            <button class="tab" onclick="switchTab('approved')">Approved</button>
            <button class="tab" onclick="switchTab('rejected')">Rejected</button>
        </div>

        <div class="content">
            <!-- Database Section -->
            <div id="database-section" class="section active">
                <h2>Database Connection Status</h2>
                <button class="btn btn-primary" onclick="testDatabase()">🔄 Test Connection</button>
                <div id="db-status"></div>
            </div>

            <!-- Users Section -->
            <div id="users-section" class="section">
                <h2>Users Management</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h2 id="total-users">0</h2>
                        <p>Total Users</p>
                    </div>
                    <div class="stat-card">
                        <h2 id="active-users">0</h2>
                        <p>Active Users</p>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="loadUsers()">🔄 Refresh Users</button>
                <div id="users-container"></div>
            </div>

            <!-- All Courses Section -->
            <div id="courses-section" class="section">
                <h2>All Courses</h2>
                <button class="btn btn-primary" onclick="loadAllCourses()">🔄 Refresh Courses</button>
                <div id="all-courses-container"></div>
            </div>

            <!-- Pending Courses Section -->
            <div id="pending-section" class="section">
                <h2>Pending Courses</h2>
                <div class="stats">
                    <div class="stat-card">
                        <h2 id="pending-count">0</h2>
                        <p>Awaiting Review</p>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="loadPendingCourses()">🔄 Refresh</button>
                <div id="pending-courses-container"></div>
            </div>

            <!-- Approved Courses Section -->
            <div id="approved-section" class="section">
                <h2>Approved Courses</h2>
                <button class="btn btn-primary" onclick="loadApprovedCourses()">🔄 Refresh</button>
                <div id="approved-courses-container"></div>
            </div>

            <!-- Rejected Courses Section -->
            <div id="rejected-section" class="section">
                <h2>Rejected Courses</h2>
                <button class="btn btn-primary" onclick="loadRejectedCourses()">🔄 Refresh</button>
                <div id="rejected-courses-container"></div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE_URL = 'http://localhost:8080/api/admin';

        // Tab switching
        function switchTab(tabName) {
            // Hide all sections
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });

            // Remove active class from all tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected section
            document.getElementById(`${tabName}-section`).classList.add('active');

            // Add active class to clicked tab
            event.target.classList.add('active');

            // Load data for the selected tab
            switch(tabName) {
                case 'database':
                    testDatabase();
                    break;
                case 'users':
                    loadUsers();
                    break;
                case 'courses':
                    loadAllCourses();
                    break;
                case 'pending':
                    loadPendingCourses();
                    break;
                case 'approved':
                    loadApprovedCourses();
                    break;
                case 'rejected':
                    loadRejectedCourses();
                    break;
            }
        }

        // Database test
        async function testDatabase() {
            const container = document.getElementById('db-status');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Testing connection...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/db-test`);
                const data = await response.json();

                if (data.status === 'SUCCESS') {
                    container.innerHTML = `
                        <div class="db-info">
                            <h3><span class="status-indicator status-connected"></span>Connected Successfully</h3>
                            <p><strong>Database:</strong> ${data.databaseProductName} ${data.databaseProductVersion}</p>
                            <p><strong>Driver:</strong> ${data.driverName} ${data.driverVersion}</p>
                            <p><strong>URL:</strong> ${data.url}</p>
                            <p><strong>Username:</strong> ${data.username}</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="error">
                            <h3><span class="status-indicator status-disconnected"></span>Connection Failed</h3>
                            <p><strong>Error:</strong> ${data.error}</p>
                            <p><strong>Type:</strong> ${data.errorType}</p>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="error">
                        <h3><span class="status-indicator status-disconnected"></span>Connection Failed</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Make sure the backend server is running on ${API_BASE_URL}</p>
                    </div>
                `;
            }
        }

        // Load users
        async function loadUsers() {
            const container = document.getElementById('users-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading users...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/users`);
                const users = await response.json();

                // Update stats
                document.getElementById('total-users').textContent = users.length;
                document.getElementById('active-users').textContent = users.filter(u => u.actif).length;

                if (users.length === 0) {
                    container.innerHTML = '<p>No users found</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                users.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.prenom || ''} ${user.nom || ''}</td>
                            <td>${user.email}</td>
                            <td>${user.role}</td>
                            <td>
                                <span class="badge ${user.actif ? 'badge-active' : 'badge-inactive'}">
                                    ${user.actif ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td>
                                ${user.actif ?
                                    `<button class="btn btn-warning" onclick="deactivateUser(${user.id})">Deactivate</button>` :
                                    '<span style="color: #999;">Deactivated</span>'
                                }
                            </td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading users: ${error.message}</div>`;
            }
        }

        // Deactivate user
        async function deactivateUser(userId) {
            if (!confirm('Are you sure you want to deactivate this user?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/users/${userId}/deactivate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert('✅ User deactivated successfully');
                    loadUsers();
                } else {
                    alert('❌ Failed to deactivate user');
                }
            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            }
        }

        // Load all courses
        async function loadAllCourses() {
            const container = document.getElementById('all-courses-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading courses...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/cours`);
                const courses = await response.json();

                displayCourses(courses, container, false);
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading courses: ${error.message}</div>`;
            }
        }

        // Load pending courses
        async function loadPendingCourses() {
            const container = document.getElementById('pending-courses-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading pending courses...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/cours/pending`);
                const courses = await response.json();

                document.getElementById('pending-count').textContent = courses.length;
                displayCourses(courses, container, true);
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading courses: ${error.message}</div>`;
            }
        }

        // Load approved courses
        async function loadApprovedCourses() {
            const container = document.getElementById('approved-courses-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading approved courses...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/cours/approved`);
                const courses = await response.json();

                displayCourses(courses, container, false);
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading courses: ${error.message}</div>`;
            }
        }

        // Load rejected courses
        async function loadRejectedCourses() {
            const container = document.getElementById('rejected-courses-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading rejected courses...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/cours/rejected`);
                const courses = await response.json();

                displayCourses(courses, container, false);
            } catch (error) {
                container.innerHTML = `<div class="error">Error loading courses: ${error.message}</div>`;
            }
        }

        // Display courses helper function
        function displayCourses(courses, container, showActions) {
            if (courses.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">No courses found</p>';
                return;
            }

            let html = '';
            courses.forEach(course => {
                const statusBadge = course.valideParAdmin === null ?
                    '<span class="badge badge-pending">Pending</span>' :
                    course.valideParAdmin ?
                    '<span class="badge badge-approved">Approved</span>' :
                    '<span class="badge badge-rejected">Rejected</span>';

                html += `
                    <div class="course-card">
                        <h3>${course.titre} ${statusBadge}</h3>
                        <p>${course.description}</p>
                        <p class="creator">
                            Created by: ${course.createur?.prenom || ''} ${course.createur?.nom || ''}
                            (${course.createur?.email || 'Unknown'})
                        </p>
                        ${showActions ? `
                            <div class="actions">
                                <button class="btn btn-success" onclick="approveCourse(${course.id})">
                                    ✓ Approve
                                </button>
                                <button class="btn btn-danger" onclick="rejectCourse(${course.id})">
                                    ✗ Reject
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Approve course
        async function approveCourse(courseId) {
            try {
                const response = await fetch(`${API_BASE_URL}/cours/${courseId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert('✅ Course approved successfully');
                    loadPendingCourses();
                } else {
                    alert('❌ Failed to approve course');
                }
            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            }
        }

        // Reject course
        async function rejectCourse(courseId) {
            if (!confirm('Are you sure you want to reject this course?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/cours/${courseId}/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (response.ok) {
                    alert('✅ Course rejected successfully');
                    loadPendingCourses();
                } else {
                    alert('❌ Failed to reject course');
                }
            } catch (error) {
                alert(`❌ Error: ${error.message}`);
            }
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            testDatabase();
        });
    </script>
</body>
</html>
