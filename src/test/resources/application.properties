# ============================================================
# SPRING BOOT APPLICATION PROPERTIES - NEON POSTGRESQL
# ============================================================

# --------------------------
# 1. DATABASE CONNECTION
# --------------------------
spring.datasource.url=jdbc:postgresql://ep-spring-cell-ab4f8r2p-pooler.eu-west-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_2qUsuybN9fJB
spring.datasource.driverClassName=org.postgresql.Driver

# --------------------------
# 2. JPA / HIBERNATE SETTINGS
# --------------------------
# Update schema automatically (use 'validate' in production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in console
spring.jpa.show-sql=true

# Use PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --------------------------
# 3. CONNECTION POOL SETTINGS (HikariCP default)
# --------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP

# --------------------------
# 4. LOGGING
# --------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --------------------------
# 5. OPTIONAL: SERVER SETTINGS
# --------------------------
# Server port (default 8080)
server.address=0.0.0.0
server.port=8080
# Enable graceful shutdown
server.shutdown=graceful

# --------------------------
# 6. SPRING SECURITY (if needed)
# --------------------------
# Disable security for testing APIs (remove in production)
# Uncomment this if you want to allow Postman requests without login
# spring.security.enabled=false