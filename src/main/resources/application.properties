# ============================================================
# SPRING BOOT APPLICATION PROPERTIES - NEON POSTGRESQL
# ============================================================

# --------------------------
# 1. DATABASE CONNECTION
# --------------------------
spring.datasource.url=jdbc:postgresql://ep-spring-cell-ab4f8r2p-pooler.eu-west-2.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_2qUsuybN9fJB
spring.datasource.driver-class-name=org.postgresql.Driver

# --------------------------
# 2. JPA / HIBERNATE SETTINGS
# --------------------------
# Update schema automatically (use 'validate' in production)
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in console
spring.jpa.show-sql=true

# Use PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --------------------------
# 3. FLYWAY MIGRATION
# --------------------------
# Disable Flyway (PostgreSQL 17.6 not yet supported by current Flyway version)
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.locations=classpath:db/migration

# --------------------------
# 4. CONNECTION POOL SETTINGS (HikariCP)
# --------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=HikariCP-Neon

# --------------------------
# 5. LOGGING
# --------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO

# --------------------------
# 6. SERVER SETTINGS
# --------------------------
# Server port (default 8080)
server.address=0.0.0.0
server.port=8083

# Enable graceful shutdown
server.shutdown=graceful

# --------------------------
# 7. JPA SETTINGS
# --------------------------
# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false
